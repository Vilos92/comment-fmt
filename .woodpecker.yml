# Woodpecker CI pipeline for comment-fmt.
#
# Installs dependencies with bun, then runs formatting, linting, typechecking,
# a combined check, the comment-fmt self-check, tests, and the package build
# as separate steps. The `check` step is intentionally redundant with
# fmt/lint/typecheck: it exercises the exact `vp check` command documented in
# AGENTS.md/README, so CI catches any drift between that documented command
# and the split jobs above.
#
# The step image (greg-zone/bun-git:1.3.14) is built locally on the CI host
# from greg-zone/ci/bun-git/Dockerfile; rebuild it there if pulls fail.

when:
  - event: pull_request
  - event: push
    branch: main

steps:
  install:
    image: greg-zone/bun-git:1.3.14
    commands:
      - bun install --frozen-lockfile

  fmt:
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run fmt:check

  lint:
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run lint

  typecheck:
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run typecheck

  check:
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run check

  comment-fmt:
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run comment-fmt:check

  test:
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run test

  build:
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run build
